name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  static:
    name: Lint / format / typecheck / i18n / tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install JS deps
        run: bun install --frozen-lockfile

      - name: Sync SvelteKit (generates .svelte-kit/tsconfig.json)
        run: bun x svelte-kit sync

      - name: Biome (lint + format check)
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: i18n catalog freshness
        run: bun run check-i18n

      - name: Bun unit tests
        run: bun test

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # `cargo fmt --check` is host-independent and doesn't need the
      # Tauri Linux build dependencies or staged sidecars.
      - name: Rust formatting
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      # `cargo test` is intentionally NOT run here. Compiling the Tauri tree on
      # Linux needs the GTK/WebKitGTK/glib system deps (glib-sys fails pkg-config
      # otherwise) AND staged Linux sidecars — i.e. a full heavy build on what is
      # meant to be the fast lint/typecheck job. The full Linux build+test runs
      # in `crossplatform-bundles.yml` on `main`; `windows-check` covers
      # Windows compile warnings on PRs. macOS bundles are intentionally local
      # only because CI cannot notarize them and macOS runners are expensive.

  bench:
    name: Scanner perf-regression gate
    needs: static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install JS deps
        run: bun install --frozen-lockfile

      # `scripts/bench-scanner.ts` imports `src/lib/bids/scanner.ts`,
      # which resolves `$lib/...` aliases via SvelteKit's generated
      # tsconfig at `.svelte-kit/tsconfig.json`. Without this sync the
      # bench fails with `Cannot find module '$lib/tsv/parse'`.
      - name: Sync SvelteKit (generates .svelte-kit/tsconfig.json)
        run: bun x svelte-kit sync

      - name: Run scanner bench (50k files) against committed baseline
        # bench/baselines/scanner.json is captured on this same CI hardware
        # (Ubuntu runners). After observing a ~2x outlier in scanMs across
        # otherwise-identical CI runs, the regression threshold sits at
        # 2.5x (see scripts/bench-scanner.ts) to absorb runner variance
        # with margin. The gate is here to catch real order-of-magnitude
        # regressions, not micro-fluctuations; if it trips again on a
        # commit that doesn't touch the scanner hot path, the next step is
        # multi-sampling within a single run, not ratcheting the threshold
        # further. Rebaseline with `BENCH_SAVE_BASELINE=1 bun run bench:scanner`.
        run: BENCH_CHECK=1 bun run bench:scanner

      - name: Upload bench result
        # Non-blocking: the bench GATE is the previous step
        # (`BENCH_CHECK=1`). This upload is informational — humans
        # inspect it when debugging a perf regression. Marked
        # `continue-on-error: true` so an artifact-storage-quota
        # exhaustion at the GitHub account level doesn't fail the
        # job. The quota recalculates every 6-12h per GH docs.
        uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: bench-result-${{ github.run_number }}
          path: bench/results/*.json
          if-no-files-found: warn
          retention-days: 30

  e2e:
    # End-to-end smoke through tauri-driver. Linux-only for now -- Windows
    # and macOS each need their own WebDriver story (WebView2's Edge driver
    # on Windows, a notarised binary + WKWebView quirks on macOS) and the
    # value of a third platform here is small while the suite is young.
    # Linux is now a release gate because it proves the WebKitGTK viewer path
    # with NiiVue's WebGL2 fallback under a real Tauri WebView.
    name: E2E (ubuntu-22.04)
    needs: static
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux Tauri build + headless-X dependencies
        # Same package set as the `build` job above, plus:
        #   - xvfb: provides a virtual display so we can run the WebView headlessly.
        #   - webkit2gtk-driver: ships the WebKitWebDriver binary that
        #     tauri-driver needs on PATH (otherwise tauri-driver fails with
        #     `CannotFindBinaryPath` and never starts).
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libxdo-dev \
            libgl1-mesa-dri \
            patchelf \
            file \
            wget \
            xvfb \
            webkit2gtk-driver

      - name: Install JS deps
        run: bun install --frozen-lockfile

      - name: Install tauri-driver
        # `cargo install` caches via rust-cache above; on a warm cache this
        # is a no-op after the first push.
        run: cargo install tauri-driver --locked

      - name: Build frontend + Tauri binary (debug)
        # wdio.conf.ts points at src-tauri/target/debug/bidsvue. We don't
        # need the full `tauri build` (which packages into .deb/.AppImage);
        # a plain `cargo build` against the workspace is faster and yields
        # the binary the driver expects.
        run: |
          bun run build
          cargo build --manifest-path src-tauri/Cargo.toml

      - name: Run E2E suite (xvfb + tauri-driver)
        env:
          # Bypass the launch screen via the test_open_dataset Tauri
          # command (see src-tauri/src/lib.rs). The Tauri binary inherits
          # the env from tauri-driver, which inherits it from this step.
          BIDSVUE_TEST_OPEN_DATASET: ${{ github.workspace }}/tests/fixtures/tiny-bids
          # Make the viewer spec a real Linux WebKitGTK render gate:
          # attach-error is not accepted and the canvas must contain pixels.
          BIDSVUE_E2E_REQUIRE_VIEWER_RENDER: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'
          # Headless WebKitGTK on Xvfb + llvmpipe (no GPU/DRM) can't composite
          # WebGL through the default DMABUF renderer, which yields a BLACK
          # canvas and would false-fail the nonblank-pixel gate above. Force the
          # non-DMABUF GL path so WebGL2 actually renders under software Mesa.
          # (Real users with a GPU are unaffected; this is a CI-env-only knob.)
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'
        run: |
          # tauri-driver spawns the Tauri app, so the driver and WDIO runner
          # must share the same Xvfb DISPLAY. Wrapping only `bun run test:e2e`
          # leaves the spawned app headless.
          xvfb-run --auto-servernum bash -c '
            set -euo pipefail
            tauri-driver &
            TAURI_DRIVER_PID=$!
            trap "kill $TAURI_DRIVER_PID 2>/dev/null || true" EXIT

            for i in $(seq 1 30); do
              if (echo > /dev/tcp/localhost/4444) 2>/dev/null; then
                echo "tauri-driver is up (after ${i}s)"
                break
              fi
              if [ "$i" = "30" ]; then
                echo "tauri-driver failed to start within 30 s"
                exit 1
              fi
              sleep 1
            done

            bun run test:e2e
          '

  windows-check:
    # Fast Windows-target lint gate. Surfaces Windows-specific compiler
    # warnings (cfg(unix)-gated code leaving unused siblings on windows-msvc)
    # in ~3-5 min, WITHOUT the ~40 min crossplatform-bundles release build +
    # NSIS packaging. `cargo check` does no codegen/link and runs no tests, so
    # the ~41 Unix-path-assuming trust/process tests (soft-failed in the bundle
    # workflow) are irrelevant here. `RUSTFLAGS=-D warnings` makes a NEW Windows
    # warning fail the PR (cargo caps dependency lints, so this gates only the
    # bidsvue crate). This is the local-lint answer for a tree whose `ring` C
    # dep can't cross-compile on macOS — let CI's native windows-latest do it.
    name: Windows cargo check (warnings gate)
    needs: static
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Rust toolchain (MSVC)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install JS deps
        # postinstall stages resources/windows/ sidecars into
        # binaries/<name>-x86_64-pc-windows-msvc.exe, which tauri_build's
        # externalBin verification needs at `cargo check` time.
        run: bun install --frozen-lockfile

      - name: Sync SvelteKit
        run: bun x svelte-kit sync

      - name: Build frontend
        # tauri_build verifies frontendDist exists; build it (fast, ~1 min)
        # rather than the full `tauri build`.
        run: bun run build

      - name: cargo check (warnings as errors)
        working-directory: src-tauri
        env:
          RUSTFLAGS: "-D warnings"
        run: cargo check --workspace --target x86_64-pc-windows-msvc
